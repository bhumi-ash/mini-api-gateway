version: "3.9"
services:
  backend-a:
    build: ./backend-a

  backend-b:
    build: ./backend-b

  redis:
    image: redis:7-alpine

  gateway:
    build: ./gateway
    depends_on:
      - backend-a
      - backend-b
      - redis
    environment:
      - REDIS_HOST=redis

  nginx:
    image: nginx:alpine
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
    ports:
      - "8000:80"
    depends_on:
      - gateway

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    depends_on:
      - gateway

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
